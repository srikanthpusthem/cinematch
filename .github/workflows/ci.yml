name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format

      - run: npm run typecheck

      - run: npm run test

      - name: Verify GitHub tracking setup safety
        run: node --test scripts/setup-github-project.test.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke test
        run: npm run test:e2e

      # User-requested review images only. Production credentials are never used.
      - name: Capture UI review with sample data
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 81
        env:
          CINEMATCH_UI_REVIEW: "1"
          REVIEW_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: npx playwright test --config playwright.ui-review.config.ts

      - name: Upload sample-data UI review images
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 81
        # Official actions/upload-artifact v4.6.2, verified release commit.
        # https://github.com/actions/upload-artifact/releases/tag/v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cinematch-ui-review-sample-data-${{ github.event.pull_request.head.sha }}
          path: |
            test-results/ui-review/*.png
            test-results/ui-review/*-sample-data-manifest.json
          if-no-files-found: error
          retention-days: 7

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cinematch
          POSTGRES_PASSWORD: cinematch
          POSTGRES_DB: cinematch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinematch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Follow the README workflow: DATABASE_URL comes from .env.local, not the
      # job environment, so the .env.local loading path is what gets tested.
      - name: Create .env.local from .env.example
        run: |
          cp .env.example .env.local
          sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgresql://cinematch:cinematch@localhost:5432/cinematch|' .env.local

      - name: Apply migrations twice and verify pgvector
        run: npm run test:db
