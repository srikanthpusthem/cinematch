name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cinematch
          POSTGRES_PASSWORD: cinematch
          POSTGRES_DB: cinematch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinematch -d cinematch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write .env.local for DB migration tests
        run: |
          cp .env.example .env.local
          printf 'DATABASE_URL=%s%s%s:%s@localhost:5432/%s\n' postgresql '://' cinematch cinematch cinematch >> .env.local

      - run: npm run test:db

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format

      - run: npm run typecheck

      - run: npm run test

      - name: Verify GitHub tracking setup safety
        run: node --test scripts/setup-github-project.test.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke test
        run: npm run test:e2e
